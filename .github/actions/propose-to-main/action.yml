name: Propose a change to main
description: >
  Commit the working tree as a pull request rather than pushing to main, so
  automation goes through the same review gate as a person.

inputs:
  token:
    description: >
      Token used to open the pull request. A GITHUB_TOKEN cannot be used to
      open one that runs CI: GitHub suppresses workflow triggering for events
      it causes, so the required checks would never start and the pull request
      would never become mergeable. Pass a personal access token.
    required: true
  pull-request:
    description: >
      "true" to open a pull request, "false" to push straight to main. The
      caller decides, because only it can see whether the token secret is set.
    required: true
  branch-slug:
    description: Short name for the branch, e.g. "sanitize" or "release-page".
    required: true
  title:
    description: Commit subject and pull request title.
    required: true
  body:
    description: Pull request body.
    required: false
    default: Opened automatically. Merges once the required checks pass.
  paths:
    description: Paths to stage. Defaults to everything that changed.
    required: false
    default: "-A"

outputs:
  changed:
    description: '"true" when there was something to commit.'
    value: ${{ steps.propose.outputs.changed }}

runs:
  using: composite
  steps:
    - id: propose
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        INPUT_SLUG: ${{ inputs.branch-slug }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git add $INPUT_PATHS
        if git diff --cached --quiet; then
          echo "Nothing to propose."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "$INPUT_TITLE"

        if [ "$INPUT_PULL_REQUEST" != "true" ]; then
          # No token, so main is necessarily still unprotected -- pushing is the
          # only thing that can work. Say so loudly rather than looking healthy.
          echo "::warning::No bot token configured; pushing straight to main." \
               "Set PANTHEON_BOT_TOKEN so automation goes through a pull request."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          exit 0
        fi

        branch="bot/${INPUT_SLUG}-${GITHUB_RUN_ID}"
        # Push HEAD by refspec rather than creating or renaming a local branch:
        # some events check the repository out detached, where `git branch -M`
        # fails outright.
        git push origin "HEAD:refs/heads/${branch}"

        gh pr create --base main --head "$branch" \
          --title "$INPUT_TITLE" --body "$INPUT_BODY"

        # --auto merges as soon as the required checks pass. It needs the
        # repository's auto-merge setting; without it the pull request is still
        # correct, it just waits for a person.
        if ! gh pr merge "$branch" --squash --auto --delete-branch; then
          echo "::warning::Could not enable auto-merge, so ${branch} is waiting" \
               "for a manual merge. Enable auto-merge on the repository."
        fi
