name: Publish Website

on:
  push:
    branches:
      - main
  # Sanitize Imports commits with GITHUB_TOKEN, which by design does not trigger
  # workflows. Without a manual trigger the site would stay stale whenever a
  # benchmark import arrived unsanitized: deploy fails on the raw commit, and
  # the commit that fixes it cannot start a new deploy.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, pantheongpu]
    container:
      image: ubuntu:24.04
    steps:
      - name: Bootstrap job container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git lsb-release tar gzip xz-utils zstd

      - name: Checkout Code
        uses: actions/checkout@v4

      # The self-hosted runner mounts the checkout into this disposable
      # container with a different UID. Explicitly trust that mounted path so
      # MkDocs can create and push the gh-pages worktree.
      - name: Trust checkout repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run Unit Tests
        run: python -m pytest

      - name: Generate Web Data
        run: |
          cp docs/assets/web_data.json /tmp/pantheon-web-data-before.json
          cp docs/assets/gpu_history.json /tmp/pantheon-gpu-history-before.json
          cp docs/assets/unsupported_workloads.json /tmp/pantheon-unsupported-before.json
          cp docs/methodology.md /tmp/pantheon-methodology-before.md
          python website_utils/generate_web_data.py

      - name: Ensure Generated Data Is Current
        run: |
          cmp -s /tmp/pantheon-methodology-before.md docs/methodology.md || {
            echo "::error::docs/methodology.md toolkit coverage is not in sync with database/*.json. Run python website_utils/generate_web_data.py and commit the result."
            exit 1
          }
          cmp -s /tmp/pantheon-web-data-before.json docs/assets/web_data.json || {
            echo "::error::docs/assets/web_data.json is not in sync with database/*.json. Run python website_utils/generate_web_data.py and commit the result."
            exit 1
          }
          cmp -s /tmp/pantheon-gpu-history-before.json docs/assets/gpu_history.json || {
            echo "::error::docs/assets/gpu_history.json is not in sync with database/*.json. Run python website_utils/generate_web_data.py and commit the result."
            exit 1
          }
          cmp -s /tmp/pantheon-unsupported-before.json docs/assets/unsupported_workloads.json || {
            echo "::error::docs/assets/unsupported_workloads.json is not in sync with database/*.json. Run python website_utils/generate_web_data.py and commit the result."
            exit 1
          }

      - name: Build Docs
        run: python -m mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
