name: Sanitize Imports

# Benchmark reports are pushed straight into database/ by an automated pipeline
# that does not run the sanitizer, so each import lands raw GPU UUIDs and serial
# numbers in a public repository and turns CI red until someone scrubs them by
# hand. This closes that loop.
#
# It cannot spin: the sanitizer is idempotent, so the commit this job makes
# produces no further changes on the run it triggers, and that run exits without
# committing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanitize-main
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ubuntu:24.04
    steps:
      - name: Bootstrap job container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git lsb-release tar gzip xz-utils zstd

      - name: Checkout Code
        uses: actions/checkout@v4

      # The runner mounts the checkout with a different UID than the container
      # user, so git refuses to operate on it until the path is trusted.
      - name: Trust checkout repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scrub host and GPU identifiers
        run: python3 website_utils/sanitize_reports.py

      - name: Regenerate published data
        run: python3 website_utils/generate_web_data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Nothing to sanitize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sanitize imported benchmark reports"
          git push
